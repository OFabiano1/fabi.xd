name: spotify — recently played

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spotify
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-spotify.mjs
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
      - name: commit se mudou
        run: |
          if [[ -n $(git status --short -- src/data/spotify.json) ]]; then
            git config user.name "fabi-bot"
            git config user.email "actions@users.noreply.github.com"
            git add src/data/spotify.json
            git commit -m "spotify: atualizar recently played"
            git push
          else
            echo "nada novo no spotify"
          fi
