<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050208" />
    <title>404 — fabi.xd</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
        --accent: #a855f7;
        --accent-2: #e04df5;
        --ink: #ececf6;
        --muted: #9a94b5;
        --graffiti: url("/fabi.xd/assets/graffiti.png");
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; }
      body {
        font-family: "JetBrains Mono", monospace;
        background: #050208;
        color: var(--ink);
        overflow: hidden;
      }
      .art {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      .art::before {
        content: "";
        position: absolute;
        inset: -20%;
        background: var(--graffiti) right bottom / 70% auto no-repeat;
        opacity: 0.18;
        mix-blend-mode: screen;
      }
      .veil {
        position: fixed;
        inset: 0;
        background: radial-gradient(72% 60% at 42% 44%, transparent 20%, #050208 86%);
      }
      .stage {
        position: relative;
        height: 100%;
        display: grid;
        place-content: center;
        gap: 22px;
        text-align: left;
        padding: 0 24px;
      }
      .tag {
        font-size: 0.72rem;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: var(--accent);
      }
      h1 {
        font-family: "Unbounded", sans-serif;
        font-weight: 900;
        font-size: clamp(4rem, 16vw, 11rem);
        line-height: 0.9;
        letter-spacing: -0.03em;
        text-shadow: 0 0 90px rgba(150, 65, 255, 0.5);
      }
      h1 em {
        font-style: normal;
        color: var(--accent-2);
      }
      p {
        max-width: 42ch;
        color: var(--muted);
        font-size: 0.9rem;
        line-height: 1.7;
      }
      .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
      a.btn {
        display: inline-flex;
        padding: 13px 24px;
        border-radius: 999px;
        text-decoration: none;
        font-size: 0.8rem;
        letter-spacing: 0.1em;
        color: #170224;
        background: var(--accent);
        box-shadow: 0 0 40px -6px rgba(150, 65, 255, 0.6);
        transition: transform 0.2s ease, background 0.2s ease;
      }
      a.btn:hover { background: var(--accent-2); transform: translateY(-2px); }
      a.ghost {
        color: var(--muted);
        text-decoration: none;
        font-size: 0.76rem;
      }
      a.ghost:hover { color: var(--accent); }
      .whisper {
        font-size: 0.68rem;
        letter-spacing: 0.16em;
        color: rgba(154, 148, 181, 0.55);
      }
      @media (max-width: 640px) {
        .art::before { background-size: 120% auto; opacity: 0.12; }
      }
    </style>
  </head>
  <body>
    <div class="art" aria-hidden="true"></div>
    <div class="veil" aria-hidden="true"></div>

    <main class="stage">
      <span class="tag">erro::404 — papel preto</span>
      <h1>4<em>0</em>4</h1>
      <p>essa página se perdeu no papel preto. tinta roxa, nada bibliotecário — só o zero branco.</p>
      <div class="row">
        <a class="btn" href="/fabi.xd/">voltar pro site</a>
        <a class="ghost" href="/fabi.xd/#lab">lab &rarr;</a>
      </div>
      <span class="whisper">dica: ctrl + alt + shift + w, quando chegar lá &gt;w&lt;</span>
    </main>

    <script>
      setTimeout(function () {
        if (!document.hidden || true) window.location.replace("/fabi.xd/")
      }, 12000)
    </script>
  </body>
</html>
